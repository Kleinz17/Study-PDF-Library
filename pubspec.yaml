# Every Flutter project has one of these. It names your app, sets the Dart
# version it needs, and lists the packages you depend on.
# Add a package with: flutter pub add <name>
name: final_project
description: Study PDF Library.
publish_to: "none"
version: 0.1.0+2

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.9
  # Lets you preview the app inside a phone frame while you develop in a
  # browser. It is switched off automatically in a release build.
  device_preview: ^1.3.1
  pdfrx: ^2.4.8 #pdf viewer
  drift: ^2.18.0 #database
  drift_flutter: ^0.1.0 # cross-platform helper
  sqlite3_flutter_libs: ^0.5.20 #native sqlite 
  file_picker: ^13.1.0
  google_fonts: ^6.2.1
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.14.11 # code generator runner
  drift_dev: ^2.18.0 # drift code generator
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "docs/assets/app-icon.png"
  
  # Adaptive Icon Setup
  adaptive_icon_background: "#3b6b94" # 
  adaptive_icon_foreground: "docs/assets/app-icon.png"
  adaptive_icon_foreground_inset: 16 #